name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nylvex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A real (if disposable) Postgres, not a placeholder string — some of
      # the provisioning tests rely on the actual unique-index concurrency
      # guarantee, which a fake connection string can't exercise. `next
      # build`'s static page-data collection also needs a reachable-looking
      # DATABASE_URL to evaluate the db client module without throwing.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nylvex_ci
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        run: npm run db:migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
