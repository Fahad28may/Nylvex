services:
  postgres:
    image: postgres:16-alpine
    container_name: nylvex-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nylvex
    ports:
      - "5434:5432"
    volumes:
      - nylvex-postgres-data:/var/lib/postgresql/data

volumes:
  nylvex-postgres-data:
